<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fintech Mobile App Redesign</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <div class="card-header">
      <div class="folder-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1F2937" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
        </svg>
      </div>

      <span class="status-badge">
        <span class="status-dot"></span>
        Active
      </span>
    </div>

    
    <h2 class="card-title">Fintech Mobile App Redesign</h2>
    <p class="card-description">
      Improve onboarding conversion and simplify the payment flow for new users.
    </p>

    
    <div class="meta-row">
      <span class="meta-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <circle cx="12" cy="10" r="3"></circle>
          <path d="M7 20.662V19a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1.662"></path>
        </svg>
        NeoPay
      </span>
      <span class="separator">&bull;</span>
      <span class="meta-item">MVP 2 weeks</span>
    </div>

    
    <div class="info-row">
      <span class="date-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path>
          <line x1="4" y1="22" x2="4" y2="15"></line>
        </svg>
        Nov 6, 2025
      </span>

      <span class="priority-item">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <rect x="2" y="10" width="2.2" height="4" rx="1" fill="#1F2937"/>
          <rect x="6.5" y="6.5" width="2.2" height="7.5" rx="1" fill="#1F2937"/>
          <rect x="11" y="3" width="2.2" height="11" rx="1" fill="#1F2937"/>
        </svg>
        High
      </span>
    </div>

    <hr class="divider">

    
    <div class="card-footer">
      <div class="stats">
        <span class="stat-item">
          <svg class="progress-ring" width="18" height="18" viewBox="0 0 20 20">
            <circle cx="10" cy="10" r="8" fill="none" stroke="#374151" stroke-width="1.6"/>
            <path d="M10 10 L10 3.5 A6.5 6.5 0 1 1 3.7 11.5 Z" fill="#E05A47"/>
          </svg>
          72%
        </span>

        <span class="stat-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 8 9 4"></polyline>
            <line x1="12" y1="6" x2="21" y2="6"></line>
            <polyline points="3 12 5 14 9 10"></polyline>
            <line x1="12" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="9" y2="18"></line>
            <line x1="12" y1="18" x2="21" y2="18"></line>
          </svg>
          18/25 Tasks
        </span>
      </div>

      <img 
        class="avatar" 
        src="https://unsplash.com" 
        alt="Assignee avatar"
      >
    </div>
  </div>

</body>
</html
